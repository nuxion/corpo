# board.spec.yaml
#
# Language-agnostic specification for an Azure DevOps "board" CLI.
# This file is meant to be fed to a coding agent (or read by a human) as the
# authoritative prompt for IMPLEMENTING the CLI in ANY language (Python, Go,
# Rust, TypeScript, C#, ...). It describes WHAT the tool must do and HOW it must
# behave, not how to write it in a specific language.
#
# Conventions used in this spec:
#   - "MUST"  = required behavior; an implementation is non-conformant without it.
#   - "SHOULD"= strongly recommended; deviate only with a documented reason.
#   - "MAY"   = optional behavior an implementation is free to add.
#
# The `extensions` section at the bottom is the supported place for each
# repository/team to layer incremental or custom behavior WITHOUT editing the
# core contract above it.

spec:
  name: board
  version: "1.0.0"
  status: stable
  summary: >
    Command-line tool to interact with an Azure DevOps (ADO) "board": work
    items such as Tasks, User Stories, and Bugs. The first and currently
    specified capability is fetching a single work item.
  audience:
    - Engineers building the CLI in a target language.
    - Coding agents generating an implementation from this spec.

# ---------------------------------------------------------------------------
# Global concepts shared by every command.
# ---------------------------------------------------------------------------
concepts:
  organization:
    description: >
      The ADO organization. Identified by its base URL. Two URL shapes exist in
      the wild and both MUST be supported:
        - Modern:  https://dev.azure.com/<org>
        - Legacy:  https://<org>.visualstudio.com
    resolution_order:
      - Explicit --org flag (highest priority).
      - Value parsed from a work-item URL argument.
      - Configured default (see configuration.defaults.org).
    notes: >
      The resolved value MUST be a full base URL (scheme + host [+ /<org>]),
      because the ADO REST/client libraries connect to that base URL.

  project:
    description: The ADO Team Project that contains the work item.
    resolution_order:
      - Explicit --project flag (highest priority).
      - Value parsed from a work-item URL argument (URL-decoded).
      - Configured default (see configuration.defaults.project).

  work_item:
    description: >
      A board entity addressed by a numeric ID. Types include (non-exhaustive)
      Task, "User Story", Bug, Feature, Epic. The fetch command MUST be
      type-agnostic: it fetches whatever type the ID resolves to.

  authentication:
    method: Personal Access Token (PAT) via HTTP Basic auth.
    scheme: >
      Basic auth with an EMPTY username and the PAT as the password
      (username="", password=<PAT>). This matches the ADO convention.
    token_source:
      description: PAT MUST be read from the environment, never hard-coded.
      env_vars:
        - AZDO_PAT   # primary
        - PAT        # fallback, checked if AZDO_PAT is unset
      on_missing: >
        Exit with a non-zero code and a clear message instructing the user to
        set AZDO_PAT or PAT. MUST NOT prompt interactively by default.
    scopes_required:
      - "Work Items (Read)"

  api:
    client: >
      Use the official ADO client library for the target language when one
      exists (e.g. azure-devops for Python, azure-devops-node-api for
      TypeScript, go-azuredevops or raw REST for Go). Otherwise call the REST
      API directly.
    rest_version: "7.1"
    work_item_expand: >
      When fetching a work item, request expansion of ALL fields and relations
      (the REST `$expand=all` / library `expand="All"` option) so descriptions,
      acceptance criteria, repro steps, and linked relations are available.

# ---------------------------------------------------------------------------
# Configuration & defaults. Implementations SHOULD make defaults overridable
# without recompiling (env vars and/or a config file), so the same binary works
# across organizations and projects.
# ---------------------------------------------------------------------------
configuration:
  defaults:
    org:
      description: Default organization base URL when none is given or parsed.
      example: "https://dev.azure.com/example-org"
      overridable_by:
        - flag: --org
        - env: ADO_DEFAULT_ORG
    project:
      description: Default project when none is given or parsed.
      example: "example-project"
      overridable_by:
        - flag: --project
        - env: ADO_DEFAULT_PROJECT
  config_file:
    optional: true
    description: >
      Implementations MAY support a config file (e.g. .board.yaml /
      board.config.json) to set defaults and extension settings. Flags and env
      vars MUST take precedence over the config file.

# ---------------------------------------------------------------------------
# COMMAND: board fetch-work
# ---------------------------------------------------------------------------
commands:
  - name: fetch-work
    invocation: "board fetch-work <ref> [options]"
    summary: >
      Fetch a single work item (Task, User Story, Bug, ...) from ADO and render
      it as a self-contained Markdown document.
    arguments:
      - name: ref
        position: 1
        required: true
        type: string
        description: >
          Either a bare numeric work-item ID, OR a full ADO work-item URL.
        accepts:
          - kind: numeric-id
            example: "7102940"
            effect: >
              org and project are NOT derived from the ref; they fall back to
              flags then configured defaults.
          - kind: full-url
            examples:
              - "https://dev.azure.com/<org>/<project>/_workitems/edit/7102940"
              - "https://dev.azure.com/<org>/<project>/_workitems/edit/7102940/"
              - "https://<org>.visualstudio.com/<project>/_workitems/edit/7102940"
              - "https://dev.azure.com/<org>/<project>/_workitems/view/7102940"
            effect: >
              The org base URL, project, and numeric ID MUST all be parsed from
              the URL. The project segment MUST be URL-decoded (e.g. %20 -> space).
    options:
      - name: --org
        type: string
        required: false
        default: "parsed from URL, else configured default org"
        description: Override the organization base URL.
      - name: --project
        type: string
        required: false
        default: "parsed from URL, else configured default project"
        description: Override the project.
      - name: --out-dir
        type: string
        required: false
        default: "reports"
        description: >
          Directory to write the Markdown file into when no explicit --out is
          given. Created if it does not exist.
      - name: --out
        type: string
        required: false
        default: null
        description: >
          Explicit output file path. Overrides the --out-dir auto-naming.
          Parent directories MUST be created if missing.
      - name: --stdout
        type: boolean
        required: false
        default: false
        description: >
          Write the Markdown to standard output instead of a file. When set,
          --out / --out-dir are ignored and nothing is written to disk.
      - name: --include-child
        type: boolean
        required: false
        default: false
        description: >
          Also fetch and render the DIRECT children (first level only) of the
          requested work item, appending each child to the same Markdown
          document after the parent. Primarily intended to share a Feature and
          obtain all of its child User Stories in one self-contained document.
          Children are discovered via hierarchy-forward relations
          (System.LinkTypes.Hierarchy-Forward). Traversal is exactly ONE level
          deep: grandchildren MUST NOT be fetched. The parent itself is always
          rendered first, regardless of this flag.

    url_parsing:
      description: Rules for extracting org, project, and id from `ref`.
      precedence: >
        If `ref` is all digits -> treat as a bare ID (no org/project parsed).
        Otherwise attempt to match a work-item URL.
      regex_reference: |
        # Reference pattern (PCRE-style, case-insensitive). Implementations may
        # adapt syntax to their language but MUST match the same set of URLs.
        https?://(?:dev\.azure\.com/(?P<org>[^/]+)/(?P<proj>[^/]+)
          |(?P<orgsub>[^./]+)\.visualstudio\.com/(?P<proj2>[^/]+))
          /_workitems/(?:edit|view)/(?P<id>\d+)
      outputs:
        - id: integer work-item id (required match group).
        - org_url: >
            "https://dev.azure.com/<org>" for the modern form, or
            "https://<orgsub>.visualstudio.com" for the legacy form.
        - project: URL-decoded project segment.
      on_no_match: >
        If `ref` is neither all-digits nor a recognized URL, exit non-zero with
        a message like: cannot parse work item id/url: <ref>.

    behavior:
      steps:
        - Parse `ref` into (id, parsed_org, parsed_project).
        - Resolve org = --org ?? parsed_org ?? default org.
        - Resolve project = --project ?? parsed_project ?? default project.
        - Read PAT from environment (AZDO_PAT then PAT); error if absent.
        - Connect to `org` using Basic auth ("", PAT).
        - Fetch the work item by id within `project`, expanding all fields/relations.
        - "If --include-child: collect the parent's direct-child ids from its
           System.LinkTypes.Hierarchy-Forward relations (one level only), fetch
           each child (expanding all fields/relations), and render each."
        - Render the work item (and any children) to Markdown (see output.markdown_contract).
        - Emit per --stdout / --out / --out-dir.
      include_child:
        relation_type: "System.LinkTypes.Hierarchy-Forward"
        depth: "Exactly one level — direct children only; do not recurse."
        child_id_source: >
          Each hierarchy-forward relation's `url` ends in the numeric work-item
          id (.../_apis/wit/workItems/<id>); parse the trailing id from it.
        ordering: "Children SHOULD be rendered in ascending id order after the parent."
        on_child_fetch_error: >
          A child that cannot be fetched MUST NOT abort the whole command: warn
          to stderr and continue with the remaining children.
        no_children: >
          If the item has no children, behave exactly as without the flag
          (render only the parent); this MUST NOT be an error.
      idempotent: true
      network: required

    output:
      markdown_contract:
        description: >
          The rendered Markdown MUST be a single, human-readable, self-contained
          document. Field labels below are canonical; values come straight from
          the work item. Empty fields SHOULD be omitted rather than shown blank.
        structure:
          - "H1 title: `# [<Type> <id>] <Title>` (fallback title `Work Item <id>` if none)."
          - "A `**URL:**` line with the canonical work-item edit URL:
             <org>/<url-encoded-project>/_workitems/edit/<id>."
          - "A 2-column Markdown metadata table (| Field | Value |) including, when present:
             ID, Type, State, Reason, Assigned To, Area Path, Iteration Path,
             Priority, Severity, Tags, Created (date by author), Changed (date by author)."
          - "Section `## Description` rendered from System.Description."
          - "Section `## Acceptance Criteria` from Microsoft.VSTS.Common.AcceptanceCriteria."
          - "Section `## Repro Steps` from Microsoft.VSTS.TCM.ReproSteps (Bugs)."
          - "Section `## System Info` from Microsoft.VSTS.TCM.SystemInfo (Bugs)."
          - "Section `## Relations` listing each relation as
             `- **<rel-type>** <url>` with an optional ` — <comment>` suffix.
             Omit the section entirely if there are no relations."
        rich_text:
          requirement: >
            ADO rich-text fields (Description, Acceptance Criteria, Repro Steps,
            System Info) arrive as HTML. They MUST be converted to readable
            Markdown (headings, bold/italic, links, ordered/unordered lists,
            code/pre, horizontal rules, basic tables/line breaks). If conversion
            fails, fall back to emitting the raw field content rather than crashing.
        identity_fields:
          requirement: >
            Person fields (Assigned To, Created By, Changed By) may be objects.
            Render as "<displayName> <<uniqueName>>" when both differ, else
            whichever single value is present.
      multi_item_document:
        description: >
          When --include-child yields one or more children, the output is a
          single document: the parent rendered first per markdown_contract,
          then each child rendered per the SAME contract, in id order. Each
          child MUST be preceded by a `---` horizontal-rule separator so the
          boundary between work items is visible. Children are appended in the
          same document whether emitting to a file or to stdout; --include-child
          MUST NOT change the file-naming (the file is still named for the
          parent) and MUST NOT split children into separate files.
      file_naming:
        when_explicit_out: "Use --out verbatim; create parent dirs."
        when_auto: >
          Write to <out-dir>/work-<id>-<slug>.md, where <slug> is the title
          lowercased, non-alphanumeric runs collapsed to single hyphens, trimmed
          of leading/trailing hyphens, capped at ~80 chars (fallback "untitled").
          The <id> is the PARENT's id even when --include-child is set.
      stdout_mode: "When --stdout is set, write Markdown to stdout and print nothing else to stdout."
      success_message: >
        On file write (non-stdout), print a confirmation to stdout such as:
        `Wrote <path>`.

    errors:
      - condition: ref cannot be parsed
        action: print "ERROR: cannot parse work item id/url: <ref>" to stderr; exit 1.
      - condition: PAT not set in environment
        action: print guidance to set AZDO_PAT or PAT to stderr; exit non-zero.
      - condition: work item fetch fails (not found, auth, network)
        action: print "ERROR: cannot fetch work item <id>: <detail>" to stderr; exit 1.
      message_target: "All error/diagnostic messages go to stderr; only results/confirmations to stdout."

    exit_codes:
      0: Success.
      1: Recoverable/expected failure (bad input, fetch failed, missing PAT).
      ">1": MAY be used for distinct categories if an implementation documents them.

    examples:
      - description: Fetch by ID using configured defaults, write to ./reports.
        command: "board fetch-work 7102940"
      - description: Fetch by full URL (org/project parsed from it).
        command: "board fetch-work https://dev.azure.com/example-org/example-project/_workitems/edit/7102940"
      - description: Override project, stream to stdout.
        command: "board fetch-work 7102940 --project example-project --stdout"
      - description: Explicit output path.
        command: "board fetch-work 7102940 --out ./stories/story-7102940.md"
      - description: Fetch a Feature together with its direct child User Stories.
        command: "board fetch-work 7102940 --include-child"

  # -------------------------------------------------------------------------
  # COMMAND: board update
  # -------------------------------------------------------------------------
  - name: update
    invocation: "board update <ref> [field-options] [options]"
    summary: >
      Update fields of a single existing work item (Task, User Story, Bug, ...)
      and/or add a discussion comment. Identifies the target exactly like
      fetch-work (bare ID or full URL) and applies one atomic update.
    shared_contract:
      ref: >
        The `ref` argument and its parsing rules are IDENTICAL to fetch-work
        (see commands[fetch-work].arguments.ref and url_parsing). Implementations
        MUST reuse the same parser, org/project resolution precedence, PAT
        handling, and stderr/stdout discipline.
    arguments:
      - name: ref
        position: 1
        required: true
        type: string
        description: Numeric work-item ID or full ADO work-item URL (see fetch-work).
    options:
      # --- target resolution (same as fetch-work) ---
      - name: --org
        type: string
        required: false
        default: "parsed from URL, else configured default org"
        description: Override the organization base URL.
      - name: --project
        type: string
        required: false
        default: "parsed from URL, else configured default project"
        description: Override the project.
      # --- convenience field flags (map to well-known ADO fields) ---
      - name: --state
        type: string
        maps_to: "System.State"
        description: 'New state, e.g. "Active", "Resolved", "Closed". Validated against the work-item type when possible.'
      - name: --title
        type: string
        maps_to: "System.Title"
        description: New title.
      - name: --assigned-to
        type: string
        maps_to: "System.AssignedTo"
        description: >
          Assignee identity (display name, unique name, or email). The empty
          string "" unassigns the item.
      - name: --iteration
        type: string
        maps_to: "System.IterationPath"
        description: Iteration path (e.g. 'example-project\\PI 2 Sprint 7').
      - name: --area
        type: string
        maps_to: "System.AreaPath"
        description: Area path.
      - name: --reason
        type: string
        maps_to: "System.Reason"
        description: State-change reason (must be valid for the target state).
      - name: --priority
        type: integer
        maps_to: "Microsoft.VSTS.Common.Priority"
        description: Priority value.
      - name: --story-points
        type: number
        maps_to: "Microsoft.VSTS.Scheduling.StoryPoints"
        description: Story points (User Story).
      # --- tags (additive/subtractive; ADO stores tags as a semicolon list) ---
      - name: --add-tag
        type: string
        repeatable: true
        description: Add a tag. May be repeated. Merged into System.Tags.
      - name: --remove-tag
        type: string
        repeatable: true
        description: Remove a tag. May be repeated. Removed from System.Tags.
      # --- arbitrary field escape hatch ---
      - name: --field
        type: "key=value"
        repeatable: true
        description: >
          Set any field by reference name, e.g. --field "Custom.Notes=hello".
          May be repeated. Takes precedence over convenience flags if both target
          the same field (and SHOULD warn on such a conflict). Value type is
          inferred (number/bool/string); use --field-string to force string.
      - name: --field-string
        type: "key=value"
        repeatable: true
        description: Like --field but always sends the value as a string.
      # --- discussion ---
      - name: --comment
        type: string
        description: >
          Add a comment to the work item's discussion. MAY be used alone (no
          field changes) or together with field updates.
      # --- safety / output ---
      - name: --dry-run
        type: boolean
        default: false
        description: >
          Compute and print the patch that WOULD be sent (and any validation
          warnings) without calling the API. Exit 0 if the patch is valid.
      - name: --if-unchanged-rev
        type: integer
        default: null
        description: >
          Optimistic concurrency: only apply if the work item's current rev
          matches this value (sent as System.Rev test in the patch). Fail with a
          distinct exit code on mismatch.
      - name: --show
        type: boolean
        default: false
        description: >
          After a successful update, print the updated work item as Markdown
          (reusing the fetch-work markdown_contract) to stdout.
      - name: --json
        type: boolean
        default: false
        description: Print the API response / resulting field summary as JSON to stdout.

    behavior:
      steps:
        - Parse `ref`; resolve org/project (flag > parsed > default); read PAT.
        - Collect requested changes from convenience flags, --field(-string),
          --add-tag/--remove-tag, and --comment.
        - "If NO changes and NO comment were requested: error (nothing to do), exit non-zero."
        - For tag edits, fetch current System.Tags, apply add/remove set-wise,
          and produce the resulting semicolon-delimited list.
        - Build a single JSON Patch document (see api.patch_format).
        - "If --dry-run: print the patch (+ warnings) and exit 0 without calling the API."
        - "If --if-unchanged-rev given: prepend a `test` op on System.Rev."
        - Send ONE update call so all field changes apply atomically.
        - "If --comment given: add the comment (separate discussion API call if the
          target language/library requires it; otherwise include in the patch)."
        - Report success; optionally render with --show / --json.
      atomicity: >
        Field updates MUST be a single patch request. If a comment is added via a
        separate call and that call fails after fields succeeded, report a partial
        success clearly (fields updated, comment failed) and exit non-zero.
      idempotent: >
        Setting a field to its current value is a no-op-equivalent and MUST NOT
        error. Tag add/remove are set operations (adding an existing tag or
        removing an absent tag is harmless).
      network: required

    api:
      operation: "Update work item by id (REST PATCH, $expand not required)."
      patch_format:
        media_type: "application/json-patch+json"
        description: >
          ADO updates are expressed as a JSON Patch array. Each changed field is
          one operation. Reference shape:
        example: |
          [
            { "op": "test",    "path": "/rev", "value": 12 },          # if --if-unchanged-rev 12
            { "op": "add",     "path": "/fields/System.State", "value": "Resolved" },
            { "op": "add",     "path": "/fields/System.Tags",  "value": "blocked; ui" },
            { "op": "remove",  "path": "/fields/System.AssignedTo" }   # when --assigned-to ""
          ]
        notes:
          - "Use `op: add` to set/overwrite a field (ADO treats add as upsert)."
          - "Use `op: remove` to clear a field (e.g. unassign)."
          - "Unassigning (--assigned-to \"\") MAY be sent as remove or as add with
             an empty value, whichever the API accepts for that field."

    output:
      success_message: >
        Print a concise confirmation to stdout, e.g.
        `Updated work item <id> (<n> field(s)[, +comment])` and the canonical URL.
      with_show: "Render the refreshed work item via the fetch-work markdown_contract."
      with_json: "Emit a machine-readable summary: { id, rev, updated_fields, comment_added }."
      diagnostics: "All warnings (e.g. flag/--field conflicts) go to stderr."

    errors:
      - condition: ref cannot be parsed
        action: "ERROR: cannot parse work item id/url: <ref>" -> stderr; exit 1.
      - condition: PAT not set
        action: guidance to set AZDO_PAT or PAT -> stderr; exit non-zero.
      - condition: no changes and no comment requested
        action: "ERROR: nothing to update (no fields or --comment given)" -> stderr; exit 2.
      - condition: invalid --field/--field-string syntax (no '=')
        action: "ERROR: --field must be key=value, got: <arg>" -> stderr; exit 2.
      - condition: rev mismatch under --if-unchanged-rev
        action: "ERROR: work item <id> changed (expected rev N, found M)" -> stderr; exit 3.
      - condition: update rejected by ADO (invalid state/transition, perms, not found)
        action: "ERROR: cannot update work item <id>: <detail>" -> stderr; exit 1.
      message_target: "Errors/warnings -> stderr; confirmations/results -> stdout."

    exit_codes:
      0: Success (including a valid --dry-run).
      1: Recoverable failure (bad input ref, fetch/update failed, missing PAT).
      2: Usage error (nothing to update, malformed --field).
      3: Optimistic-concurrency conflict (--if-unchanged-rev mismatch).

    scopes_required:
      - "Work Items (Read & Write)"

    examples:
      - description: Move a work item to Resolved.
        command: 'board update 7102940 --state Resolved'
      - description: Reassign and add tags in one atomic update.
        command: 'board update 7102940 --assigned-to "jane@contoso.com" --add-tag ui --add-tag blocked'
      - description: Unassign an item.
        command: 'board update 7102940 --assigned-to ""'
      - description: Set a custom field and add a comment.
        command: 'board update 7102940 --field "Custom.Notes=needs design" --comment "Pinged design team"'
      - description: Preview the patch without applying it.
        command: 'board update 7102940 --state Closed --reason "Completed" --dry-run'
      - description: Safe update guarded by current revision, then show the result.
        command: 'board update 7102940 --title "New title" --if-unchanged-rev 12 --show'
      - description: Update by full URL (org/project parsed from it).
        command: 'board update https://dev.azure.com/example-org/example-project/_workitems/edit/7102940 --state Active'

# ---------------------------------------------------------------------------
# Cross-cutting requirements every command MUST honor.
# ---------------------------------------------------------------------------
conformance:
  cli:
    - "MUST expose `board <command> [args]` with subcommands; `fetch-work` is the first."
    - "MUST provide `--help` for the program and each subcommand."
    - "Unknown subcommands/flags MUST fail with a non-zero exit and usage text."
  secrets:
    - "MUST NOT log, echo, or write the PAT anywhere."
  stability:
    - "Flag names, exit-code meaning, and the Markdown contract above are the
       STABLE public surface. Breaking them requires a major version bump."
  testing:
    - "URL parsing (both URL shapes, trailing slash, edit vs view, encoded
       project) SHOULD have unit tests."
    - "Resolution precedence (flag > parsed > default) for org and project
       SHOULD have unit tests."
    - "Markdown rendering SHOULD be covered by a golden/snapshot test against a
       fixture work item, with network calls mocked."

# ---------------------------------------------------------------------------
# EXTENSION POINTS
#
# This section is intentionally open. Each repository/team that adopts the CLI
# can add incremental or custom behavior HERE without altering the core
# contract above. An implementation MUST treat everything below as additive:
# absence of any extension MUST NOT change core behavior.
# ---------------------------------------------------------------------------
extensions:
  philosophy: >
    The core spec defines the smallest stable contract. Customizations layer on
    top via the hooks below. Downstream specs SHOULD copy this file and append
    to `extensions` rather than editing the `commands`/`output` contracts, so
    they can pull in upstream updates cleanly.

  versioning:
    contract: >
      Downstream files SHOULD record `extends: board.spec.yaml@<version>` so a
      tool/agent can detect when the base spec moved ahead of a customization.

  hooks:
    - id: field_map
      applies_to: [fetch-work]
      description: >
        Override or extend which ADO fields map to which Markdown labels/sections.
        Lets a team surface custom fields (e.g. Microsoft.VSTS.Common.* or
        Custom.* fields) without changing code.
      shape:
        add_metadata_rows:
          - { label: "Story Points", field: "Microsoft.VSTS.Scheduling.StoryPoints" }
        add_sections:
          - { heading: "Custom Notes", field: "Custom.Notes", rich_text: true }
        hide_rows: ["Severity"]
    - id: output_template
      applies_to: [fetch-work]
      description: >
        Provide an alternate output renderer/format. Implementations SHOULD keep
        Markdown as the default but MAY add formats here.
      shape:
        format: markdown   # markdown | json | yaml | <custom-template-path>
        template: null     # optional path to a user template
    - id: naming_scheme
      applies_to: [fetch-work]
      description: Customize auto file naming and output directory layout.
      shape:
        pattern: "work-{id}-{slug}.md"   # tokens: {id} {type} {slug} {project} {state}
        subdir_by: null                  # e.g. "type" -> reports/User Story/...
    - id: defaults_profile
      applies_to: ["*"]
      description: >
        Named profiles bundling org + project (+ team) so users can switch
        contexts, e.g. `board fetch-work 123 --profile example`.
      shape:
        profiles:
          example:
            org: "https://dev.azure.com/example-org"
            project: "example-project"
    - id: post_fetch_actions
      applies_to: [fetch-work]
      description: >
        Optional steps to run AFTER a successful fetch (e.g. open in editor,
        copy to clipboard, append to an index file). MUST be opt-in and MUST NOT
        change exit code on their own failure unless configured to.
      shape:
        actions: []   # e.g. ["index-append", "open-editor"]

  future_commands:
    note: >
      The `commands` list is expected to grow (e.g. list, search, update,
      comment, link). New commands MUST follow the same conformance rules
      (help, exit codes, stderr/stdout discipline, PAT handling) and SHOULD reuse
      the org/project resolution and URL-parsing concepts defined above.
    candidates:
      - name: list
        sketch: "board list --iteration <path> [--type ...] — list work items."
      - name: comment
        sketch: >
          board comment <id> <text> — standalone comment command. NOTE: `board
          update --comment` already covers the common case; a dedicated command
          would add listing/threading.
      - name: create
        sketch: "board create --type <type> --title <title> [--field k=v ...]"
