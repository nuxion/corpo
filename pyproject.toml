[project]
name = "ado_actions"
version = "0.1.0"
description = "template project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Xavier Petit", email = "nuxion@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
    "azure-devops>=7.1.0b4",
]

[tool.jupytext]
formats = "ipynb,py"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]
